<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El boletín · Librería Arenales</title>
<meta name="description" content="El boletín mensual de Librería Arenales: recomendaciones, calendario de actividades y novedades de la librería en Chamberí, Madrid.">
<meta property="og:type" content="website">
<meta property="og:title" content="El boletín · Librería Arenales">
<meta property="og:description" content="El boletín mensual de Librería Arenales: recomendaciones, calendario de actividades y novedades de la librería en Chamberí, Madrid.">
<meta property="og:url" content="https://www.arenaleslibreria.com/newsletter.html">
<meta property="og:image" content="https://www.arenaleslibreria.com/img/espacio/newsletter-portada.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#faf9f6; --tinte:#eef3f0; --sup:#ffffff;
  --marca:#024228; --solido:#024228; --sobre:#ffffff;
  --tinta:#16251e; --tinta-2:#5d6b64; --naranja:#e95513; --linea:#dbe3dd;
  --bg:var(--papel); --fg:var(--tinta); --fg-2:var(--tinta-2);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a14; --fg:#f0f4f1; --fg-2:#a3b3aa; --sup:#15241d; --tinte:#15241d;
    --linea:#2b3a33; --marca:#ffffff; --solido:#ffffff; --sobre:#0e1a14; --naranja:#ff8a5c;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a14; --fg:#f0f4f1; --fg-2:#a3b3aa; --sup:#15241d; --tinte:#15241d;
  --linea:#2b3a33; --marca:#ffffff; --solido:#ffffff; --sobre:#0e1a14; --naranja:#ff8a5c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:Montserrat,system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
h1{margin:0;font-weight:700;letter-spacing:-.022em;line-height:1.08;color:var(--marca)}
.env{max-width:74rem;margin:0 auto;padding:0 28px}
.lab{font-size:.665rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--fg-2);margin:0}

.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 93%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
.nav .env{display:flex;align-items:center;gap:22px;height:60px}
.marca{font-weight:700;font-size:1.02rem;color:var(--marca);text-decoration:none;white-space:nowrap}
.nav nav{margin-left:auto;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.nav nav::-webkit-scrollbar{display:none}
.nav nav a{font-size:.665rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  text-decoration:none;color:var(--fg-2);white-space:nowrap}
.nav nav a:hover,.nav nav a.on{color:var(--marca)}
.nav nav a.on{text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--naranja);text-decoration-thickness:2px}

.cabecera .env{padding:54px 28px 30px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.cabecera h1{font-size:clamp(1.8rem,4.2vw,2.7rem);margin-top:12px}
.selector{display:flex;gap:8px;align-items:center}
.selector select{font:inherit;font-size:.85rem;padding:10px 14px;border:1px solid var(--linea);
  background:var(--sup);color:var(--fg)}

.hoja{max-width:680px;margin:0 auto;padding:0 28px 20px}
.hoja img{width:100%;border:1px solid var(--linea)}

.acciones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:26px 28px 70px}
.btn{text-decoration:none;padding:13px 24px;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  font-weight:600;border:1.5px solid transparent}
.btn-a{background:var(--solido);color:var(--sobre)}
.btn-b{border-color:var(--marca);color:var(--marca)}

.pie-sitio{background:var(--tinte);border-top:1px solid var(--linea)}
.pie-sitio .env{padding:44px 28px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.pie-sitio p{margin:0;font-size:.9rem;color:var(--fg-2)}
.volver{font-size:.665rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--naranja);text-decoration:none}

.flotante{position:fixed;right:20px;bottom:20px;z-index:60;display:inline-flex;align-items:center;gap:11px;
  background:var(--solido);color:var(--sobre);text-decoration:none;padding:14px 20px;border-radius:999px;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.55);font-size:.74rem;letter-spacing:.06em;font-weight:600}
.flotante b{font-weight:700}
@media(max-width:560px){.flotante span{display:none}.flotante{padding:15px 18px}}
</style>
</head>
<body>

<header class="nav">
  <div class="env">
    <a class="marca" href="index.html">Librería Arenales</a>
    <nav>
      <a href="index.html">La librería</a>
      <a href="index.html#espacio">El espacio</a>
      <a href="index.html#boletin" class="on">El boletín</a>
      <a href="chat.html">El librero</a>
    </nav>
  </div>
</header>

<section class="cabecera">
  <div class="env">
    <div>
      <p class="lab">El boletín de Arenales</p>
      <h1 id="titulo-numero"></h1>
    </div>
    <div class="selector" id="selector-wrap" style="display:none;">
      <label class="lab" for="num">Otros números</label>
      <select id="num" aria-label="Elegir número"></select>
    </div>
  </div>
</section>

<div class="hoja">
  <img id="img-hoja" src="" alt="" loading="lazy">
</div>

<div class="acciones">
  <a class="btn btn-a" id="btn-suscribir" href="#">Suscribirme al boletín</a>
  <a class="btn btn-b" id="btn-pdf" href="#">Descargar en PDF</a>
</div>

<footer class="pie-sitio">
  <div class="env">
    <p>Librería Arenales · C. de Vallehermoso, 110 · Chamberí, Madrid</p>
    <a class="volver" href="index.html">← Volver a la librería</a>
  </div>
</footer>

<a class="flotante" href="chat.html">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
  <b>¿Qué leo?</b><span> · Pregúntale al librero</span>
</a>

<script>
  // BOLETINES lo usan index.html (muestra el primero, como portada) y
  // esta página (arma el selector con todos y muestra el que se elija).
  const BOLETINES = [
    { id: "2026-09", titulo: "Septiembre 2026",
      imagen: "img/espacio/newsletter-completo.jpg",
      portada: "img/espacio/newsletter-portada.jpg",
      pdf: "newsletter/2026-09.pdf" },
  ];

  const ALTA_BOLETIN = "https://4c26b6c3.sibforms.com/serve/MUIFAN_NrGp9TAZur-UMZvlCZm0ahmZJA0lI2rRy7vgQa7_XlBYjeJ8yV0W-JpYT-V-h_sq4oqQAF0I4hAGv051eDkSbSfairjDhyzjnZDyAWZGLi6spboJ6oJRmT8LX_J2MXAiLtUnb_0Ce2g7ouB-Qo41WavPxRLmZr3chSLV8JA2HMrGS4C0dwrTZU9bHxOSLluQB_zS1NxJRZw==";
  const CORREO_LIBRERIA = "contacto@arenaleslibreria.com";

  function pintar(id) {
    const entrada = BOLETINES.find((b) => b.id === id) || BOLETINES[BOLETINES.length - 1];
    document.getElementById('titulo-numero').textContent = entrada.titulo;
    const img = document.getElementById('img-hoja');
    img.src = entrada.imagen;
    img.alt = 'Boletín de ' + entrada.titulo + ' completo';
    document.getElementById('btn-pdf').href = entrada.pdf;
  }

  function armarSelector() {
    const wrap = document.getElementById('selector-wrap');
    if (BOLETINES.length <= 1) return;
    wrap.style.display = '';
    const select = document.getElementById('num');
    BOLETINES.forEach((b) => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.titulo;
      select.appendChild(opt);
    });
    select.value = BOLETINES[BOLETINES.length - 1].id;
    select.addEventListener('change', () => pintar(select.value));
  }

  armarSelector();
  pintar(BOLETINES[BOLETINES.length - 1].id);

  const botonSuscribir = document.getElementById('btn-suscribir');
  if (ALTA_BOLETIN) {
    botonSuscribir.href = ALTA_BOLETIN;
    botonSuscribir.target = '_blank';
    botonSuscribir.rel = 'noopener';
  } else {
    botonSuscribir.href = 'mailto:' + CORREO_LIBRERIA + '?subject=' + encodeURIComponent('Quiero suscribirme al boletín');
  }
</script>

</body>
</html>
